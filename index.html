<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>God Eyes AI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;600;700&family=Share+Tech+Mono&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: 'Rajdhani', 'Orbitron', sans-serif;
            background-image: 
                radial-gradient(ellipse at 30% 20%, rgba(255, 100, 0, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(255, 140, 0, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #0a0a0a 0%, #1a0a00 100%);
            position: relative;
            overflow-x: hidden;
        }

        .grid-bg {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            background-image: 
                linear-gradient(rgba(255, 100, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 100, 0, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0, 0); }
            100% { transform: translate(60px, 60px); }
        }

        .orbs {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
        }
        .orbs .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.10;
            animation: orbFloat 20s ease-in-out infinite alternate;
        }
        .orbs .orb:nth-child(1) {
            width: 350px; height: 350px;
            background: #ff6b00;
            top: -80px; left: -120px;
            animation-duration: 25s;
        }
        .orbs .orb:nth-child(2) {
            width: 450px; height: 450px;
            background: #ff8c00;
            bottom: -120px; right: -180px;
            animation-duration: 30s;
            animation-delay: 5s;
        }
        .orbs .orb:nth-child(3) {
            width: 250px; height: 250px;
            background: #ff4500;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-duration: 18s;
            animation-delay: 2s;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(60px, -40px) scale(1.1); }
            66% { transform: translate(-40px, 60px) scale(0.9); }
            100% { transform: translate(30px, -20px) scale(1.05); }
        }

        .container {
            max-width: 600px;
            width: 100%;
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 100, 0, 0.15);
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 0 80px rgba(255, 100, 0, 0.04), inset 0 0 80px rgba(255, 100, 0, 0.02);
            position: relative;
            z-index: 1;
            animation: containerPulse 4s ease-in-out infinite;
        }
        @keyframes containerPulse {
            0%, 100% { border-color: rgba(255, 100, 0, 0.15); }
            50% { border-color: rgba(255, 100, 0, 0.30); }
        }

        .header {
            text-align: center;
            border-bottom: 1px solid rgba(255, 100, 0, 0.06);
            padding-bottom: 18px;
            margin-bottom: 20px;
            position: relative;
        }
        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #ff6b00, #ffa500, #ff6b00, transparent);
            animation: linePulse 3s ease-in-out infinite;
        }
        @keyframes linePulse {
            0%, 100% { opacity: 0.3; transform: scaleX(1); }
            50% { opacity: 1; transform: scaleX(1.05); }
        }
        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #ff6b00, #ffa500, #ff8c00);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientMove 4s ease-in-out infinite;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .header p {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.25);
            letter-spacing: 6px;
            margin-top: 4px;
        }
        .header .badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 20px;
            border-radius: 30px;
            background: rgba(255, 100, 0, 0.06);
            border: 1px solid rgba(255, 100, 0, 0.08);
            font-size: 0.55rem;
            color: #ff8c00;
            letter-spacing: 3px;
            font-family: 'Share Tech Mono', monospace;
        }

        .chat-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 450px;
            overflow-y: auto;
            padding-right: 4px;
            margin-bottom: 14px;
            min-height: 250px;
        }
        .chat-container::-webkit-scrollbar { width: 3px; }
        .chat-container::-webkit-scrollbar-track { background: transparent; }
        .chat-container::-webkit-scrollbar-thumb { background: #ff6b00; border-radius: 4px; }

        .message {
            max-width: 88%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.6;
            animation: msgPop 0.3s ease;
            word-wrap: break-word;
            font-family: 'Rajdhani', sans-serif;
        }
        @keyframes msgPop {
            from { opacity: 0; transform: scale(0.95) translateY(6px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .message.user {
            align-self: flex-end;
            background: rgba(255, 100, 0, 0.08);
            border: 1px solid rgba(255, 100, 0, 0.06);
            color: #f0f0f0;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.85);
            border-bottom-left-radius: 4px;
        }
        .message.ai .label {
            font-size: 0.55rem;
            color: #ff8c00;
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 2px;
            margin-bottom: 4px;
            display: block;
        }
        .message .time {
            font-size: 0.5rem;
            color: rgba(255, 255, 255, 0.08);
            margin-top: 4px;
            text-align: right;
            font-family: 'Share Tech Mono', monospace;
        }

        .message .media-container {
            margin-top: 8px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 100, 0, 0.06);
            max-width: 100%;
        }
        .message .media-container img {
            width: 100%;
            display: block;
        }
        .message .media-container video {
            width: 100%;
            display: block;
            max-height: 300px;
        }
        .message .media-container .caption {
            padding: 8px 12px;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.15);
            background: rgba(0,0,0,0.3);
            font-family: 'Share Tech Mono', monospace;
            letter-spacing: 1px;
        }

        .message .typing-dots {
            display: inline-flex;
            gap: 4px;
        }
        .message .typing-dots span {
            width: 8px;
            height: 8px;
            background: #ff8c00;
            border-radius: 50%;
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .message .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .message .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes dotBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.2; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        .input-group {
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 100, 0, 0.04);
            padding-top: 14px;
        }
        .input-group input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255, 100, 0, 0.06);
            background: rgba(0,0,0,0.3);
            color: #f0f0f0;
            font-size: 0.9rem;
            outline: none;
            font-family: 'Rajdhani', sans-serif;
            transition: 0.3s;
        }
        .input-group input:focus {
            border-color: rgba(255, 100, 0, 0.15);
        }
        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.08);
        }
        .input-group button {
            padding: 14px 28px;
            border-radius: 40px;
            border: none;
            background: linear-gradient(135deg, #ff6b00, #ff8c00);
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }
        .input-group button:hover {
            transform: scale(1.02);
            box-shadow: 0 0 40px rgba(255, 100, 0, 0.1);
        }
        .input-group button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none !important;
        }

        .footer {
            text-align: center;
            margin-top: 20px;
            border-top: 1px solid rgba(255, 100, 0, 0.02);
            padding-top: 16px;
            font-size: 0.5rem;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.04);
            font-family: 'Share Tech Mono', monospace;
        }
        .footer .credit {
            color: #888888;
            font-size: 0.85rem;
            font-weight: 700;
            display: block;
            margin-top: 4px;
            letter-spacing: 2px;
        }

        @media (max-width: 480px) {
            .container { padding: 20px; }
            .header h1 { font-size: 1.8rem; }
            .input-group input { font-size: 0.8rem; padding: 12px 14px; }
            .input-group button { padding: 12px 20px; font-size: 0.7rem; }
            .message { font-size: 0.8rem; padding: 10px 14px; }
            .chat-container { max-height: 320px; }
        }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #ff6b00; border-radius: 4px; }
    </style>
</head>
<body>

    <div class="grid-bg"></div>
    <div class="orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>God Eyes AI</h1>
            <p>◈ ARTIFICIAL INTELLIGENCE ◈</p>
            <span class="badge">⚡ SMART</span>
        </div>

        <div class="chat-container" id="chatContainer">
            <div class="message ai">
                <span class="label">◈ GOD EYES AI</span>
                Halo! Saya God Eyes AI. Saya bisa bantu apapun—tanya, curhat, minta saran, bikin gambar, bikin video, atau apa aja. Yuk ngobrol! 😊
                <div class="time">Online</div>
            </div>
        </div>

        <div class="input-group">
            <input type="text" id="userInput" placeholder="Ketik pesan..." autocomplete="off">
            <button id="sendBtn">◈ KIRIM</button>
        </div>

        <div class="footer">
            <span>God Eyes AI — Artificial Intelligence</span>
            <span class="credit">@create apk by samil</span>
        </div>
    </div>

    <script>
        // ============================================================
        // STATE
        // ============================================================
        let chatHistory = [];
        let isProcessing = false;

        // ============================================================
        // ELEMEN
        // ============================================================
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');

        // ============================================================
        // FUNGSI WAKTU
        // ============================================================
        function getTime() {
            const now = new Date();
            return String(now.getHours()).padStart(2, '0') + ':' + 
                   String(now.getMinutes()).padStart(2, '0') + ':' + 
                   String(now.getSeconds()).padStart(2, '0');
        }

        // ============================================================
        // GENERATE GAMBAR (SIMULASI)
        // ============================================================
        function generateImage(prompt) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            const grad = ctx.createLinearGradient(0, 0, 400, 300);
            grad.addColorStop(0, '#1a0a00');
            grad.addColorStop(0.5, '#331100');
            grad.addColorStop(1, '#0a0a0a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 400, 300);

            for (let i = 0; i < 5; i++) {
                const x = 50 + Math.random() * 300;
                const y = 50 + Math.random() * 200;
                const r = 20 + Math.random() * 40;
                const alpha = 0.1 + Math.random() * 0.15;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 100, 0, ${alpha})`;
                ctx.fill();
            }

            ctx.strokeStyle = 'rgba(255, 100, 0, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 20; i++) {
                ctx.beginPath();
                ctx.moveTo(i * 20, 0);
                ctx.lineTo(i * 20, 300);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i * 20);
                ctx.lineTo(400, i * 20);
                ctx.stroke();
            }

            ctx.fillStyle = 'rgba(255, 100, 0, 0.15)';
            ctx.font = '20px "Orbitron", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('◈ GOD EYES AI', 200, 150);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.font = '12px "Share Tech Mono", monospace';
            ctx.fillText('"' + prompt.substring(0, 30) + '"', 200, 180);

            ctx.fillStyle = 'rgba(255, 100, 0, 0.03)';
            ctx.font = '10px "Share Tech Mono", monospace';
            ctx.fillText('203\'X AI GENERATED', 200, 280);

            return canvas.toDataURL('image/png');
        }

        // ============================================================
        // GENERATE VIDEO (SIMULASI)
        // ============================================================
        function generateVideo(prompt) {
            const canvas = document.createElement('canvas');
            canvas.width = 400;
            canvas.height = 300;
            const ctx = canvas.getContext('2d');

            let frame = 0;
            const frames = 30;

            function drawFrame() {
                ctx.fillStyle = '#0a0a0a';
                ctx.fillRect(0, 0, 400, 300);

                const grad = ctx.createRadialGradient(
                    200 + Math.sin(frame * 0.1) * 50,
                    150 + Math.cos(frame * 0.15) * 40,
                    20,
                    200, 150, 150
                );
                grad.addColorStop(0, `rgba(255, 100, 0, ${0.05 + Math.sin(frame * 0.05) * 0.03})`);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 400, 300);

                ctx.strokeStyle = `rgba(255, 100, 0, ${0.02 + Math.sin(frame * 0.05) * 0.01})`;
                ctx.lineWidth = 1;
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.moveTo(i * 20 + frame * 0.5 % 20, 0);
                    ctx.lineTo(i * 20 + frame * 0.5 % 20, 300);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, i * 20 + frame * 0.3 % 20);
                    ctx.lineTo(400, i * 20 + frame * 0.3 % 20);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(255, 100, 0, ${0.1 + Math.sin(frame * 0.03) * 0.05})`;
                ctx.font = '18px "Orbitron", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('◈ GOD EYES AI', 200, 150);

                ctx.fillStyle = `rgba(255, 255, 255, ${0.04 + Math.sin(frame * 0.04) * 0.02})`;
                ctx.font = '11px "Share Tech Mono", monospace';
                ctx.fillText('VIDEO GENERATED', 200, 180);

                frame++;
                if (frame < frames) {
                    requestAnimationFrame(drawFrame);
                }
            }

            const stream = canvas.captureStream(15);
            const video = document.createElement('video');
            video.srcObject = stream;
            video.muted = true;
            video.autoplay = true;
            video.loop = false;
            video.style.width = '100%';
            video.style.borderRadius = '8px';

            drawFrame();

            setTimeout(() => {
                stream.getTracks().forEach(t => t.stop());
            }, 2500);

            return video;
        }

        // ============================================================
        // AI LOGIC
        // ============================================================
        function getAIResponse(userMessage, history) {
            const msg = userMessage.toLowerCase().trim();

            if (msg.includes('bikin gambar') || msg.includes('buat gambar') || msg.includes('gambar') && msg.includes('tolong')) {
                const prompt = userMessage.replace(/bikin gambar|buat gambar|tolong bikin|tolong buat/gi, '').trim() || 'gambar abstrak';
                return {
                    type: 'image',
                    text: `Saya buatkan gambar untuk "${prompt}" ya! 🎨`,
                    imageData: generateImage(prompt)
                };
            }

            if (msg.includes('bikin video') || msg.includes('buat video') || msg.includes('video') && msg.includes('tolong')) {
                const prompt = userMessage.replace(/bikin video|buat video|tolong bikin|tolong buat/gi, '').trim() || 'video abstrak';
                return {
                    type: 'video',
                    text: `Saya buatkan video untuk "${prompt}" ya! 🎬`,
                    videoElement: generateVideo(prompt)
                };
            }

            for (let i = history.length - 1; i >= 0; i--) {
                const h = history[i];
                if (h.sender === 'user') {
                    const prevMsg = h.text.toLowerCase();
                    if (prevMsg.includes('bikin gambar') || prevMsg.includes('buat gambar')) {
                        if (msg.includes('terima kasih') || msg.includes('makasih') || msg.includes('bagus')) {
                            return { type: 'text', text: 'Sama-sama! Senang bisa membantu. Ada lagi yang bisa saya buatkan? 😊' };
                        }
                        if (msg.includes('ubah') || msg.includes('ganti') || msg.includes('lain')) {
                            const newPrompt = userMessage.replace(/ubah|ganti|lain/gi, '').trim() || 'gambar baru';
                            return {
                                type: 'image',
                                text: `Baik, saya buatkan yang baru untuk "${newPrompt}"! 🎨`,
                                imageData: generateImage(newPrompt)
                            };
                        }
                        if (!msg.includes('gambar') && !msg.includes('video')) {
                            return { type: 'text', text: `Gambar sebelumnya sudah jadi. Mau saya buatkan gambar lain atau ada yang lain?` };
                        }
                    }
                    if (prevMsg.includes('bikin video') || prevMsg.includes('buat video')) {
                        if (msg.includes('terima kasih') || msg.includes('makasih') || msg.includes('bagus')) {
                            return { type: 'text', text: 'Sama-sama! Senang bisa membantu. Ada lagi yang bisa saya buatkan? 😊' };
                        }
                        if (msg.includes('ubah') || msg.includes('ganti') || msg.includes('lain')) {
                            const newPrompt = userMessage.replace(/ubah|ganti|lain/gi, '').trim() || 'video baru';
                            return {
                                type: 'video',
                                text: `Baik, saya buatkan video baru untuk "${newPrompt}"! 🎬`,
                                videoElement: generateVideo(newPrompt)
                            };
                        }
                        if (!msg.includes('gambar') && !msg.includes('video')) {
                            return { type: 'text', text: `Video sebelumnya sudah jadi. Mau saya buatkan video lain atau ada yang lain?` };
                        }
                    }
                }
            }

            // Balasan default
            const defaultReplies = [
                "Menarik! Bisa ceritakan lebih lanjut?",
                "Saya mengerti. Ada yang bisa saya bantu lebih lanjut?",
                "Hmm, itu pertanyaan yang bagus. Saya akan pikirkan sebentar...",
                "Wah, topik yang seru! Yuk kita bahas lebih dalam.",
                "Saya senang Anda bertanya! Mari kita eksplorasi bersama.",
                "Oke, saya dengar. Apa pendapat Anda tentang itu?",
                "Saya selalu siap membantu. Ada yang lain?",
                "Itu perspektif yang menarik! Coba jelaskan lebih detail.",
                "Saya suka cara berpikir Anda! Lanjutkan..."
            ];
            return { type: 'text', text: defaultReplies[Math.floor(Math.random() * defaultReplies.length)] };
        }

        // ============================================================
        // TAMBAH PESAN
        // ============================================================
        function addMessage(text, sender = 'user', media = null) {
            const div = document.createElement('div');
            div.className = 'message ' + sender;

            let content = '';
            if (sender === 'ai') {
                content += `<span class="label">◈ GOD EYES AI</span>`;
            }

            content += text;

            if (media) {
                if (media.type === 'image') {
                    content += `
                        <div class="media-container">
                            <img src="${media.data}" alt="Generated Image">
                            <div class="caption">◈ AI GENERATED</div>
                        </div>
                    `;
                } else if (media.type === 'video') {
                    content += `
                        <div class="media-container">
                            <div id="videoContainer_${Date.now()}"></div>
                            <div class="caption">◈ AI GENERATED</div>
                        </div>
                    `;
                }
            }

            content += `<div class="time">${getTime()}</div>`;
            div.innerHTML = content;

            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (media && media.type === 'video' && media.element) {
                const container = div.querySelector('.media-container > div');
                if (container) {
                    container.appendChild(media.element);
                }
            }

            chatHistory.push({
                sender: sender,
                text: text,
                time: getTime(),
                media: media || null
            });
        }

        // ============================================================
        // TYPING
        // ============================================================
        function showTyping() {
            const div = document.createElement('div');
            div.className = 'message ai';
            div.id = 'typingIndicator';
            div.innerHTML = `
                <span class="label">◈ GOD EYES AI</span>
                <div class="typing-dots">
                    <span></span><span></span><span></span>
                </div>
            `;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideTyping() {
            const typing = document.getElementById('typingIndicator');
            if (typing) typing.remove();
        }

        // ============================================================
        // KIRIM PESAN
        // ============================================================
        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;
            if (isProcessing) return;

            addMessage(text, 'user');
            userInput.value = '';
            userInput.focus();

            isProcessing = true;
            sendBtn.disabled = true;

            showTyping();

            const delay = 400 + Math.random() * 1200;
            setTimeout(() => {
                hideTyping();

                const response = getAIResponse(text, chatHistory);
                addMessage(response.text, 'ai', response.imageData ? { type: 'image', data: response.imageData } : 
                                             response.videoElement ? { type: 'video', element: response.videoElement } : null);

                isProcessing = false;
                sendBtn.disabled = false;
            }, delay);
        }

        // ============================================================
        // EVENT
        // ============================================================
        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.focus();
    </script>
</body>
  </html>
